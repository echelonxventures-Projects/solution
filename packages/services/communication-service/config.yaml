server:
  port: 3004
  host: "0.0.0.0"

database:
  host: "localhost"
  port: 5432
  name: "consultancy_communication"
  user: "postgres"
  password: "postgres"
  max_connections: 20

kafka:
  brokers: ["localhost:9092"]
  topic_prefix: "consultancy"

webrtc:
  ice_servers:
    - urls: ["stun:stun.l.google.com:19302"]
    - urls: ["stun:stun1.l.google.com:19302"]
  # For production, add TURN servers
  turn_servers: []
  max_participants: 10
  session_timeout_minutes: 120

recording:
  enabled: true
  storage_path: "/var/consultancy/recordings"
  max_duration_hours: 4
  format: "webm"

transcription:
  enabled: true
  provider: "whisper"  # whisper, google, aws
  language: "auto"

signaling:
  port: 3004
  heartbeat_interval_seconds: 30

logging:
  level: "info"
  format: "json"