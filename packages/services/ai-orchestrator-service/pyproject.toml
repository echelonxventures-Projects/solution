[project]
name = "ai-orchestrator-service"
version = "1.0.0"
description = "AI Orchestrator Service for Online Consultancy Platform"
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "asyncpg>=0.29.0",
    "aiokafka>=0.10.0",
    "anthropic>=0.18.0",
    "openai>=1.12.0",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.5",
    "langchain-anthropic>=0.1.0",
    "numpy>=1.26.0",
    "python-multipart>=0.0.6",
    "aiohttp>=3.9.0",
    "redis>=5.0.0",
    "tenacity>=8.2.0",
    "structlog>=24.1.0",
]