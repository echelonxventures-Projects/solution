[project]
name = "analytics-service"
version = "1.0.0"
description = "Analytics Service for metrics, dashboards, and predictive analytics"
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "asyncpg>=0.29.0",
    "aiokafka>=0.10.0",
    "redis>=5.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "prophet>=1.1.5",
    "matplotlib>=3.8.0",
    "structlog>=24.1.0",
    "tenacity>=8.2.0",
    "aiohttp>=3.9.0",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
