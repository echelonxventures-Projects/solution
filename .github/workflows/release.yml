name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          body: |
            ## Release Notes

            ### Changes
            - Please see commit history for detailed changes

            ### Deployment Instructions
            1. Pull the latest images: `docker pull consultancy/*:${{ github.ref_name }}`
            2. Apply Kubernetes configs: `kubectl apply -R -f infrastructure/kubernetes`
            3. Run database migrations: `psql $DATABASE_URL -f database/migrations/*.sql`

            ### Rollback Instructions
            If issues occur, rollback to previous version:
            ```bash
            kubectl rollout undo deployment --namespace consultancy
            ```
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-packages:
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: user-service
          - image: consultant-service
          - image: booking-service
          - image: billing-service
          - image: communication-service
          - image: content-service
          - image: ai-orchestrator-service
          - image: memory-service
          - image: search-service
          - image: notification-service
          - image: analytics-service
          - image: compliance-service
          - image: integration-service
          - image: vertical-service
          - image: web-app
          - image: admin-dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Determine context path
        id: context
        run: |
          if [[ "${{ matrix.image }}" == "web-app" ]]; then
            echo "context=packages/web" >> $GITHUB_OUTPUT
          elif [[ "${{ matrix.image }}" == "admin-dashboard" ]]; then
            echo "context=packages/admin" >> $GITHUB_OUTPUT
          else
            echo "context=packages/services/${{ matrix.image }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push release image
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.context.outputs.context }}
          push: true
          tags: |
            consultancy/${{ matrix.image }}:${{ github.ref_name }}
            consultancy/${{ matrix.image }}:latest

  notify-release:
    needs: publish-packages
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "🚀 New release published: ${{ github.ref_name }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Release ${{ github.ref_name }} published successfully*\n\nAll Docker images have been pushed to Docker Hub. Production deployment will begin shortly."
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}