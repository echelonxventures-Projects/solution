global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  # ============================================
  # KUBERNETES COMPONENTS
  # ============================================

  - job_name: 'kubernetes-apiservers'
    kubernetes_sd_configs:
      - role: endpoints
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
      - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
        action: keep
        regex: default;kubernetes;https

  - job_name: 'kubernetes-nodes'
    kubernetes_sd_configs:
      - role: node
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token

  - job_name: 'kubernetes-pods'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - consultancy
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__

  # ============================================
  # APPLICATION SERVICES
  # ============================================

  - job_name: 'user-service'
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - consultancy
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        action: keep
        regex: user-service

  - job_name: 'consultant-service'
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - consultancy
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        action: keep
        regex: consultant-service

  - job_name: 'booking-service'
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - consultancy
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        action: keep
        regex: booking-service

  - job_name: 'billing-service'
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - consultancy
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        action: keep
        regex: billing-service

  - job_name: 'communication-service'
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - consultancy
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        action: keep
        regex: communication-service

  - job_name: 'ai-orchestrator-service'
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - consultancy
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        action: keep
        regex: ai-orchestrator-service

  - job_name: 'memory-service'
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - consultancy
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        action: keep
        regex: memory-service

  - job_name: 'search-service'
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - consultancy
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        action: keep
        regex: search-service

  - job_name: 'analytics-service'
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - consultancy
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        action: keep
        regex: analytics-service

  - job_name: 'notification-service'
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - consultancy
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        action: keep
        regex: notification-service

  # ============================================
  # DATABASES
  # ============================================

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka-exporter:9308']

  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongodb-exporter:9216']

  - job_name: 'elasticsearch'
    static_configs:
      - targets: ['elasticsearch-exporter:9114']

  # ============================================
  # INGRESS & SYSTEM
  # ============================================

  - job_name: 'nginx-ingress'
    static_configs:
      - targets: ['nginx-ingress-controller:10254']

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']