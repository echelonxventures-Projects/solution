apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-orchestrator-service
  namespace: consultancy
  labels:
    app: ai-orchestrator-service
    tier: backend
    language: python
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-orchestrator-service
  template:
    metadata:
      labels:
        app: ai-orchestrator-service
    spec:
      containers:
      - name: ai-orchestrator-service
        image: consultancy/ai-orchestrator-service:latest
        ports:
        - containerPort: 3007
        env:
        - name: PORT
          value: "3007"
        envFrom:
        - configMapRef:
            name: consultancy-config
        - secretRef:
            name: consultancy-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3007
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3007
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ai-orchestrator-service
  namespace: consultancy
spec:
  selector:
    app: ai-orchestrator-service
  ports:
  - port: 3007
    targetPort: 3007
  type: ClusterIP