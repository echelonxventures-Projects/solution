apiVersion: apps/v1
kind: Deployment
metadata:
  name: communication-service
  namespace: consultancy
  labels:
    app: communication-service
    tier: backend
    language: go
spec:
  replicas: 3
  selector:
    matchLabels:
      app: communication-service
  template:
    metadata:
      labels:
        app: communication-service
    spec:
      containers:
      - name: communication-service
        image: consultancy/communication-service:latest
        ports:
        - containerPort: 3004
        env:
        - name: PORT
          value: "3004"
        envFrom:
        - configMapRef:
            name: consultancy-config
        - secretRef:
            name: consultancy-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3004
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3004
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: communication-service
  namespace: consultancy
spec:
  selector:
    app: communication-service
  ports:
  - port: 3004
    targetPort: 3004
  type: ClusterIP