apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-service
  namespace: consultancy
  labels:
    app: memory-service
    tier: backend
    language: python
spec:
  replicas: 2
  selector:
    matchLabels:
      app: memory-service
  template:
    metadata:
      labels:
        app: memory-service
    spec:
      containers:
      - name: memory-service
        image: consultancy/memory-service:latest
        ports:
        - containerPort: 3008
        env:
        - name: PORT
          value: "3008"
        envFrom:
        - configMapRef:
            name: consultancy-config
        - secretRef:
            name: consultancy-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3008
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3008
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: memory-service
  namespace: consultancy
spec:
  selector:
    app: memory-service
  ports:
  - port: 3008
    targetPort: 3008
  type: ClusterIP