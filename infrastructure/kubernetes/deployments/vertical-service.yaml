apiVersion: apps/v1
kind: Deployment
metadata:
  name: vertical-service
  namespace: consultancy
  labels:
    app: vertical-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vertical-service
  template:
    metadata:
      labels:
        app: vertical-service
    spec:
      containers:
      - name: vertical-service
        image: consultancy/vertical-service:latest
        ports:
        - containerPort: 3014
        env:
        - name: PORT
          value: "3014"
        envFrom:
        - configMapRef:
            name: consultancy-config
        - secretRef:
            name: consultancy-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3014
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3014
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: vertical-service
  namespace: consultancy
spec:
  selector:
    app: vertical-service
  ports:
  - port: 3014
    targetPort: 3014
  type: ClusterIP
