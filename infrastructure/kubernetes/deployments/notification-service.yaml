apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: consultancy
  labels:
    app: notification-service
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
      - name: notification-service
        image: consultancy/notification-service:latest
        ports:
        - containerPort: 3010
        env:
        - name: PORT
          value: "3010"
        envFrom:
        - configMapRef:
            name: consultancy-config
        - secretRef:
            name: consultancy-secrets
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3010
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: consultancy
spec:
  selector:
    app: notification-service
  ports:
  - port: 3010
    targetPort: 3010
  type: ClusterIP