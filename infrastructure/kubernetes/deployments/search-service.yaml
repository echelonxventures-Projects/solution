apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service
  namespace: consultancy
  labels:
    app: search-service
    tier: backend
    language: go
spec:
  replicas: 2
  selector:
    matchLabels:
      app: search-service
  template:
    metadata:
      labels:
        app: search-service
    spec:
      containers:
      - name: search-service
        image: consultancy/search-service:latest
        ports:
        - containerPort: 3009
        env:
        - name: PORT
          value: "3009"
        envFrom:
        - configMapRef:
            name: consultancy-config
        - secretRef:
            name: consultancy-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3009
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3009
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: search-service
  namespace: consultancy
spec:
  selector:
    app: search-service
  ports:
  - port: 3009
    targetPort: 3009
  type: ClusterIP