apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: consultancy
  labels:
    app: billing-service
    tier: backend
    language: go
spec:
  replicas: 2
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
    spec:
      containers:
      - name: billing-service
        image: consultancy/billing-service:latest
        ports:
        - containerPort: 3005
        env:
        - name: PORT
          value: "3005"
        envFrom:
        - configMapRef:
            name: consultancy-config
        - secretRef:
            name: consultancy-secrets
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "300m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3005
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3005
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: billing-service
  namespace: consultancy
spec:
  selector:
    app: billing-service
  ports:
  - port: 3005
    targetPort: 3005
  type: ClusterIP