apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: consultancy
  labels:
    app: web-app
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
      - name: web-app
        image: consultancy/web-app:latest
        ports:
        - containerPort: 1112
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "https://api.consultancy.com"
        envFrom:
        - configMapRef:
            name: consultancy-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 1112
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 1112
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web-app
  namespace: consultancy
spec:
  selector:
    app: web-app
  ports:
  - port: 1112
    targetPort: 1112
  type: ClusterIP