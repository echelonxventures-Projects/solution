apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: consultancy-ingress
  namespace: consultancy
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  tls:
  - hosts:
    - api.consultancy.com
    - consultancy.com
    - admin.consultancy.com
    secretName: consultancy-tls
  rules:
  # API Gateway
  - host: api.consultancy.com
    http:
      paths:
      - path: /auth
        pathType: Prefix
        backend:
          service:
            name: user-service
            port:
              number: 3001
      - path: /users
        pathType: Prefix
        backend:
          service:
            name: user-service
            port:
              number: 3001
      - path: /consultants
        pathType: Prefix
        backend:
          service:
            name: consultant-service
            port:
              number: 3002
      - path: /verticals
        pathType: Prefix
        backend:
          service:
            name: vertical-service
            port:
              number: 3014
      - path: /bookings
        pathType: Prefix
        backend:
          service:
            name: booking-service
            port:
              number: 3003
      - path: /sessions
        pathType: Prefix
        backend:
          service:
            name: communication-service
            port:
              number: 3004
      - path: /payments
        pathType: Prefix
        backend:
          service:
            name: billing-service
            port:
              number: 3005
      - path: /content
        pathType: Prefix
        backend:
          service:
            name: content-service
            port:
              number: 3006
      - path: /ai
        pathType: Prefix
        backend:
          service:
            name: ai-orchestrator-service
            port:
              number: 3007
      - path: /memory
        pathType: Prefix
        backend:
          service:
            name: memory-service
            port:
              number: 3008
      - path: /search
        pathType: Prefix
        backend:
          service:
            name: search-service
            port:
              number: 3009
      - path: /notifications
        pathType: Prefix
        backend:
          service:
            name: notification-service
            port:
              number: 3010
      - path: /analytics
        pathType: Prefix
        backend:
          service:
            name: analytics-service
            port:
              number: 3011
      - path: /compliance
        pathType: Prefix
        backend:
          service:
            name: compliance-service
            port:
              number: 3012
      - path: /integrations
        pathType: Prefix
        backend:
          service:
            name: integration-service
            port:
              number: 3013
      - path: /admin
        pathType: Prefix
        backend:
          service:
            name: admin-dashboard
            port:
              number: 1113

  # Web Application
  - host: consultancy.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-app
            port:
              number: 3000

  # Admin Dashboard
  - host: admin.consultancy.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: admin-dashboard
            port:
              number: 3002