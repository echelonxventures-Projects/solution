apiVersion: v1
kind: Secret
metadata:
  name: consultancy-secrets
  namespace: consultancy
type: Opaque
stringData:
  # Database credentials
  DATABASE_URL: "postgresql://consultancy:password@postgres:5432/consultancy"
  DATABASE_USER: "consultancy"
  DATABASE_PASSWORD: "CHANGE_ME_IN_PRODUCTION"

  # MongoDB
  MONGODB_URI: "mongodb://mongodb:27017/consultancy"
  MONGODB_USER: "consultancy"
  MONGODB_PASSWORD: "CHANGE_ME_IN_PRODUCTION"

  # Redis
  REDIS_PASSWORD: "CHANGE_ME_IN_PRODUCTION"

  # JWT
  JWT_SECRET: "CHANGE_ME_IN_PRODUCTION"
  JWT_EXPIRY: "7d"

  # Kafka
  KAFKA_USERNAME: "consultancy"
  KAFKA_PASSWORD: "CHANGE_ME_IN_PRODUCTION"

  # Stripe
  STRIPE_API_KEY: "sk_live_CHANGE_ME"
  STRIPE_WEBHOOK_SECRET: "whsec_CHANGE_ME"

  # PayPal
  PAYPAL_CLIENT_ID: "CHANGE_ME"
  PAYPAL_CLIENT_SECRET: "CHANGE_ME"

  # Twilio
  TWILIO_ACCOUNT_SID: "CHANGE_ME"
  TWILIO_AUTH_TOKEN: "CHANGE_ME"
  TWILIO_PHONE_NUMBER: "+1234567890"

  # SendGrid
  SENDGRID_API_KEY: "CHANGE_ME"

  # WhatsApp Business
  WHATSAPP_BUSINESS_TOKEN: "CHANGE_ME"
  WHATSAPP_PHONE_NUMBER_ID: "CHANGE_ME"

  # Anthropic Claude
  ANTHROPIC_API_KEY: "CHANGE_ME"

  # OpenAI
  OPENAI_API_KEY: "CHANGE_ME"

  # Pinecone
  PINECONE_API_KEY: "CHANGE_ME"
  PINECONE_ENVIRONMENT: "production"

  # Neo4j
  NEO4J_URI: "neo4j://neo4j:7687"
  NEO4J_USER: "neo4j"
  NEO4J_PASSWORD: "CHANGE_ME"

  # Elasticsearch
  ELASTICSEARCH_PASSWORD: "CHANGE_ME"

  # TimescaleDB
  TIMESCALEDB_PASSWORD: "CHANGE_ME"

  # WebRTC TURN servers
  TURN_SERVER_USERNAME: "CHANGE_ME"
  TURN_SERVER_PASSWORD: "CHANGE_ME"

  # Admin credentials
  ADMIN_API_KEY: "CHANGE_ME"